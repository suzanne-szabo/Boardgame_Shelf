<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Shelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <h1 class="site-title">Game Shelf</h1>
            <button type="button" id="add-game-btn" class="btn btn-primary">+ Add Game</button>

            <div class="controls">
                <label for="search-input" class="visually-hidden">Search games</label>
                <input type="search" id="search-input" placeholder="Search name, type, status, notes...">

                <label for="sort-select" class="visually-hidden">Sort games</label>
                <select id="sort-select">
                    <option value="name-asc">Name (A–Z)</option>
                    <option value="name-desc">Name (Z–A)</option>
                    <option value="type">Type</option>
                    <option value="rating">Rating (highest first)</option>
                    <option value="complexity">Complexity (lightest first)</option>
                    <option value="play_time">Play time (shortest first)</option>
                    <option value="price">Price (lowest first)</option>
                    <option value="status">Status (Owned first)</option>
                </select>
            </div>
        </div>
    </header>

    <main class="shelf">
        <div id="game-grid" class="card-grid"></div>
        <p id="empty-message" class="empty-message hidden">No games found.</p>
    </main>

    <dialog id="form-dialog" class="dialog">
        <form id="game-form">
            <h2 id="form-title">Add a Game</h2>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="game_type">Type</label>
                <select id="game_type" name="game_type">
                    <option value="Strategy">Strategy</option>
                    <option value="Party">Party</option>
                    <option value="Cooperative">Cooperative</option>
                    <option value="Family">Family</option>
                    <option value="Deck-building">Deck-building</option>
                    <option value="Card">Card</option>
                    <option value="Abstract">Abstract</option>
                    <option value="Trivia">Trivia</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="min_players">Min Players</label>
                    <input type="number" id="min_players" name="min_players" min="1">
                </div>
                <div class="form-group">
                    <label for="max_players">Max Players</label>
                    <input type="number" id="max_players" name="max_players" min="1">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="play_time">Play Time (minutes)</label>
                    <input type="number" id="play_time" name="play_time" min="1">
                </div>
                <div class="form-group">
                    <label for="min_age">Minimum Age</label>
                    <input type="number" id="min_age" name="min_age" min="0">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="complexity">Complexity</label>
                    <select id="complexity" name="complexity">
                        <option value="1">1 – Light</option>
                        <option value="2">2 – Medium-Light</option>
                        <option value="3">3 – Medium</option>
                        <option value="4">4 – Medium-Heavy</option>
                        <option value="5">5 – Heavy</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rating">Rating</label>
                    <select id="rating" name="rating">
                        <option value="1">1 ★</option>
                        <option value="2">2 ★★</option>
                        <option value="3">3 ★★★</option>
                        <option value="4">4 ★★★★</option>
                        <option value="5">5 ★★★★★</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="price">Price ($)</label>
                    <input type="number" id="price" name="price" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="Owned">Owned</option>
                        <option value="Wishlist">Wishlist</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" rows="3"></textarea>
            </div>

            <div class="form-actions">
                <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </dialog>

    <dialog id="detail-dialog" class="dialog">
        <div id="detail-content"></div>

        <div class="form-actions">
            <button type="button" id="delete-btn" class="btn btn-danger">Delete</button>
            <button type="button" id="edit-btn" class="btn btn-secondary">Edit</button>
            <button type="button" id="close-detail-btn" class="btn btn-primary">Close</button>
        </div>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
