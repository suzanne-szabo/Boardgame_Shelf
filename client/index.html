<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Shelf</title>
    <link rel="stylesheet" href="style.css?v=2">

</head>
<body>
    <main id="auth-container">
        <h1>Game Shelf</h1>

        <section id="login-section">
            <h2>Log In</h2>
            <form id="login-form">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password" required>

                <button type="submit">Log In</button>
            </form>
            <p id="login-message" role="status"></p>
            <p class="auth-switch">
                New to Game Shelf?
                <button type="button" id="show-register-btn" class="link-btn">Create a new account</button>
            </p>
        </section>

        <section id="register-section" class="hidden">
            <h2>Create an Account</h2>
            <form id="register-form">
                <label for="register-first-name">First Name</label>
                <input type="text" id="register-first-name" required>

                <label for="register-last-name">Last Name</label>
                <input type="text" id="register-last-name" required>

                <label for="register-email">Email</label>
                <input type="email" id="register-email" required>

                <label for="register-password">Password</label>
                <input type="password" id="register-password" required>

                <button type="submit">Register</button>
            </form>
            <p id="register-message" role="status"></p>
            <p class="auth-switch">
                Already have an account?
                <button type="button" id="show-login-btn" class="link-btn">Log in</button>
            </p>
        </section>
    </main>
    

    <script src="auth.js?v=2"></script>
</body>
</html>
